<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>元素定位工具箱</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Segoe UI,Roboto}
body{background:#0f172a;color:#f1f5f9;min-height:100vh;padding:20px}
.container{max-width:1200px;margin:0 auto}
.header{text-align:center;margin-bottom:24px}
h1{background:linear-gradient(90deg,#38bdf8,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.tool-bar{display:flex;gap:10px;margin-bottom:16px}
.btn{padding:10px 16px;background:#1e293b;border:1px solid #334155;border-radius:10px;color:#f1f5f9;cursor:pointer}
.btn:hover{border-color:#38bdf8}
.main{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:768px){.main{grid-template-columns:1fr}}
.panel{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px}
.panel h3{margin-bottom:12px;color:#7dd3fc}
textarea{width:100%;height:360px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#f1f5f9;padding:14px}
#preview{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:14px;height:360px;overflow:auto}
.result-box{margin-top:12px;padding:12px;background:#0f172a;border:1px solid #334155;border-radius:8px}
.result-item{margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #334155}
.result-label{color:#94a3b8;font-size:13px}
.result-content{color:#bbf7d0;margin-top:4px}
</style>
</head>
<body>

<div class="container">
  <div class="header"><h1>元素定位工具箱</h1></div>
  <div class="tool-bar">
    <button class="btn" onclick="parseHtml()">解析HTML</button>
    <button class="btn" onclick="copyAll()">复制全部</button>
    <button class="btn" onclick="clearAll()">清空</button>
  </div>

  <div class="main">
    <div class="panel">
      <h3>HTML 源码</h3>
      <textarea id="htmlInput"></textarea>
    </div>
    <div class="panel">
      <h3>预览（点击获取选择器）</h3>
      <div id="preview"></div>
    </div>
  </div>

  <div class="panel">
    <h3>分析结果</h3>
    <div class="result-box">
      <div class="result-item">
        <div class="result-label">XPath</div>
        <div class="result-content" id="xp">-</div>
      </div>
      <div class="result-item">
        <div class="result-label">CSS 选择器（正确）</div>
        <div class="result-content" id="css">-</div>
      </div>
      <div class="result-item">
        <div class="result-label">元素文本</div>
        <div class="result-content" id="text">-</div>
      </div>
      <div class="result-item">
        <div class="result-label">元素 HTML</div>
        <div class="result-content" id="html">-</div>
      </div>
      <div class="result-item">
        <div class="result-label">元素属性</div>
        <div class="result-content" id="attr">-</div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let currentEl = null;

// 解析HTML
function parseHtml() {
  $('preview').innerHTML = $('htmlInput').value;
  bindClick();
}

// 绑定点击（不污染样式）
function bindClick() {
  $('preview').onclick = function(e) {
    e.preventDefault();
    currentEl = e.target;

    // 正确获取所有结果
    $('xp').innerText = getXPath(e.target);
    $('css').innerText = getCSSSelector(e.target); // 这行现在 100% 正确
    $('text').innerText = e.target.innerText.trim() || '(无文本)';
    $('html').innerText = e.target.outerHTML.substring(0, 400);
    $('attr').innerText = getAttrs(e.target);
  };
}

// ==============================
// 正确 XPath（无错版）
// ==============================
function getXPath(el) {
  if (!el) return '';
  if (el.id) return `//*[@id="${el.id}"]`;
  if (el === document.body) return '/html/body';
  let pos = 0;
  const siblings = el.parentNode.children;
  for (let i = 0; i < siblings.length; i++) {
    if (siblings[i] === el) break;
    if (siblings[i].tagName === el.tagName) pos++;
  }
  return getXPath(el.parentNode) + '/' + el.tagName.toLowerCase() + '[' + (pos + 1) + ']';
}

// ==============================
// 正确 CSS 选择器（修复版！不会出现.highlight）
// ==============================
function getCSSSelector(el) {
  if (!el) return "";

  // 优先 id
  if (el.id) {
    return "#" + el.id;
  }

  // 再用 class
  if (el.className && typeof el.className === "string") {
    const cls = el.className.trim().replace(/\s+/g, ".");
    if (cls) return "." + cls;
  }

  // 再用标签
  const tag = el.tagName.toLowerCase();
  if (el === document.body) return tag;

  return getCSSSelector(el.parentNode) + " > " + tag;
}

// 获取属性
function getAttrs(el) {
  let arr = [];
  for (let i = 0; i < el.attributes.length; i++) {
    const name = el.attributes[i].name;
    const val = el.attributes[i].value;
    arr.push(name + '="' + val + '"');
  }
  return arr.join("\n") || "(无属性)";
}

// 复制
function copyAll() {
  const txt = `XPath: ${$('xp').innerText}\nCSS: ${$('css').innerText}\n文本: ${$('text').innerText}`;
  navigator.clipboard.writeText(txt).then(() => alert("已复制"));
}

// 清空
function clearAll() {
  $('htmlInput').value = "";
  $('preview').innerHTML = "";
  $('xp').innerText = "-";
  $('css').innerText = "-";
  $('text').innerText = "-";
  $('html').innerText = "-";
  $('attr').innerText = "-";
  currentEl = null;
}
</script>
</body>
</html>
